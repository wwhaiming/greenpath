name: CI

on:
  push:
    branches: [main, greenpath-new]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        # No OPENAI_API_KEY needed: the LLM is mocked in tests and the eval is
        # deterministic (no model calls).
        run: python -m pytest tests/ -q
      - name: Evaluation harness (deterministic accuracy gate)
        run: python evals/eval.py --threshold 0.95
