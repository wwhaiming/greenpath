services:
  - type: web
    name: greenpath
    runtime: python
    # Flask backend (server.py exposes `app`): serves public/ as static root AND all /api/* routes.
    # OPENAI_API_KEY is read from the env var below; it can also be loaded from the committed
    # .env via load_dotenv() in server.py.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 60 --workers 2
    pullRequestPreviewsEnabled: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FORCE_HTTPS
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: greenpath-redis
          property: connectionString

  - type: keyvalue
    name: greenpath-redis
    plan: free
    ipAllowList: []
